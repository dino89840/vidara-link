<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vidara M3U8 Extractor</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0c0d12;
    color: #e5e7eb;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: #14161c;
    border: 1px solid #262932;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p.sub { margin: 0 0 20px; color: #9ca3af; font-size: 13px; }
  input, button, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2f3a;
    background: #0f1116;
    color: #e5e7eb;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: #6366f1; }
  button {
    background: #ef4444;
    border: none;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background .15s;
  }
  button:hover { background: #dc2626; }
  button:disabled { background: #4b5563; cursor: not-allowed; }
  .row { margin-bottom: 12px; }
  textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .result { margin-top: 20px; display: none; }
  .result.show { display: block; }
  .label { font-size: 12px; color: #9ca3af; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  .status { margin-top: 10px; font-size: 13px; }
  .status.err { color: #f87171; }
  .status.ok  { color: #4ade80; }
  .copy {
    display: inline-block;
    margin-top: 6px;
    padding: 6px 12px;
    font-size: 12px;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 6px;
    cursor: pointer;
    width: auto;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Vidara M3U8 Extractor</h1>
    <p class="sub">Vidara video link ကို paste လုပ်ပြီး m3u8 direct link ရယူပါ။</p>

    <div class="row">
      <input id="url" type="text"
             placeholder="https://vidara.to/v/XXXXXXXXXX"
             value="https://vidara.to/v/1ZtCr4uRKqKz" />
    </div>

    <button id="go">Extract m3u8</button>
    <div id="status" class="status"></div>

    <div id="result" class="result">
      <div class="label">Title</div>
      <div id="title"></div>

      <div class="label">M3U8 Direct Link</div>
      <textarea id="m3u8" readonly></textarea>
      <button class="copy" id="copy">Copy link</button>

      <div class="label">Open in Player</div>
      <div>
        <a id="openLink" target="_blank" rel="noopener"
           style="color:#60a5fa; word-break:break-all; font-size:13px;">–</a>
      </div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);

$("go").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if (!url) { setStatus("Link ထည့်ပါ", "err"); return; }

  $("go").disabled = true;
  setStatus("ရှာနေပါသည်...", "");
  $("result").classList.remove("show");

  try {
    const res = await fetch("/api/extract?url=" + encodeURIComponent(url));
    const data = await res.json();

    if (!res.ok || !data.streaming_url) {
      setStatus("Error: " + (data.error || "unknown") +
                (data.detail ? " — " + data.detail : ""), "err");
      return;
    }

    $("title").textContent = data.title || "(untitled)";
    $("m3u8").value  = data.streaming_url;
    $("openLink").href = data.streaming_url;
    $("openLink").textContent = data.streaming_url;
    $("result").classList.add("show");
    setStatus("အောင်မြင်ပါသည်", "ok");
  } catch (e) {
    setStatus("Fetch error: " + e.message, "err");
  } finally {
    $("go").disabled = false;
  }
});

$("copy").addEventListener("click", async () => {
  const t = $("m3u8");
  t.select();
  try {
    await navigator.clipboard.writeText(t.value);
    $("copy").textContent = "Copied ✓";
    setTimeout(()=> $("copy").textContent = "Copy link", 1500);
  } catch {}
});

function setStatus(msg, cls) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status " + (cls || "");
}
</script>
</body>
</html>
